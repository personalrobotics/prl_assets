[project]
name = "prl_assets"
version = "0.1.0"
description = "Reusable manipulation objects (cans, bins, tableware, containers) for MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "src/prl_assets/objects/ycbv/NOTICE.md", "src/prl_assets/objects/ycbv/LICENSE-*.txt"]
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
maintainers = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
dependencies = [
    "numpy>=1.22",
    "fast-simplification>=0.1.13",
    "trimesh>=4.11.1",
]

[project.optional-dependencies]
ycbv = [
    "coacd==1.0.14",
    "mujoco>=3.3",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "pillow>=10.0",
]

# prl_assets.authoring: measuring, fitting and writing object models.
authoring = [
    "mujoco>=3.3",
    "pyyaml>=6.0",
    "scipy>=1.10",
]
dev = [
    "hatchling==1.32.4",
    "pytest>=7.0",
    "mujoco>=3.3",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "ruff>=0.4",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prl_assets"]

[tool.hatch.build.targets.wheel.force-include]
"docs/ycbv_audit.json" = "prl_assets/objects/ycbv/overlap_audit.json"
"docs/ycbv_catalog.json" = "prl_assets/objects/ycbv/catalog_audit.json"

[project.urls]
Homepage = "https://github.com/personalrobotics/prl_assets"
Repository = "https://github.com/personalrobotics/prl_assets"
Issues = "https://github.com/personalrobotics/prl_assets/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/prl_assets/__init__.py" = ["F401"]
