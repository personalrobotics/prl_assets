name: notebook
description: Amazon Basics hardcover notebook
category: [office, graspable, flat]

mass: 0.3  # kg
dimensions: [0.128, 0.212, 0.016]  # meters
material: paper
amazon_link: https://www.amazon.com/dp/B01DN8TCEU

geometric_properties:
  type: box
  size: [0.128, 0.212, 0.016]

mujoco:
  xml_path: notebook.xml
  scale: 1.0
  friction: [0.7, 0.005, 0.0001]

perception:
  aliases: ["notebook", "journal", "book"]

policy:
  grasping:
    affordances: [lift, place]
    preferred_grasp_type: pinch_grasp
    difficulty: medium
  manipulation:
    stable_poses: [flat]

# Grasp regions (docs/schema.md): the legacy grasp primitive above as one region at
# the object frame, with the grasp families the legacy path uses, so either path
# makes the same candidates. geometric_properties stays until its readers migrate.
grasp_regions:
  version: 1
  regions:
  - name: body
    primitive: box
    size: [0.128, 0.212, 0.016]
    strategies: [face_x, face_y, top, bottom]
