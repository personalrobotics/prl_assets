name: pocky_box
description: Pocky chocolate biscuit sticks box
category: [food_package, graspable, box]

mass: 0.15  # kg
dimensions: [0.158, 0.028, 0.084]  # meters
material: cardboard
amazon_link: https://www.amazon.com/dp/B004AH51VW

geometric_properties:
  type: box
  size: [0.158, 0.028, 0.084]

mujoco:
  xml_path: pocky_box.xml
  scale: 1.0
  friction: [0.7, 0.005, 0.0001]

perception:
  aliases: ["pocky", "pocky box", "biscuit sticks"]

policy:
  grasping:
    affordances: [lift, place]
    preferred_grasp_type: side_grasp
    difficulty: medium
  manipulation:
    stable_poses: [upright, on_side]

# Grasp regions (docs/schema.md): the legacy grasp primitive above as one region at
# the object frame, with the grasp families the legacy path uses, so either path
# makes the same candidates. geometric_properties stays until its readers migrate.
grasp_regions:
  version: 1
  regions:
  - name: body
    primitive: box
    size: [0.158, 0.028, 0.084]
    strategies: [face_x, face_y, top, bottom]
